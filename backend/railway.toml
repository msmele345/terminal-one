# Railway service config for the backend (D11). Set this service's
# Root Directory to "backend" in the Railway dashboard so this file and the
# Dockerfile are discovered. Postgres is attached as a separate Railway plugin;
# it injects DATABASE_URL / PG* — map them to SPRING_DATASOURCE_* env vars
# (see docs/deploy-railway.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "java -jar /app/app.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
