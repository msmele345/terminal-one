# Terminal One — backend configuration (12-factor: all secrets via env).
# Local dev defaults point at a local Postgres; production values are injected
# by Railway env vars (DATABASE_URL → SPRING_DATASOURCE_*, JWT_SECRET, etc.).
spring:
  application:
    name: terminal-one-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/terminalone}
    username: ${SPRING_DATASOURCE_USERNAME:terminalone}
    password: ${SPRING_DATASOURCE_PASSWORD:terminalone}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

# Actuator: expose only health, publicly (see SecurityConfig).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # MUST be overridden in production. HS256 requires >= 256-bit (32+ char) key.
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
    issuer: terminal-one
  seed-user:
    # The single V1 account. Seeded on startup if absent. Override in prod.
    username: ${APP_USER_USERNAME:trader}
    password: ${APP_USER_PASSWORD:changeme}
  market-data:
    # MarketData.app (D3). Token is empty in dev (boots fine without it); set
    # MARKETDATA_TOKEN in Railway for live data. 15-min cache TTL respects credits.
    base-url: ${MARKETDATA_BASE_URL:https://api.marketdata.app/v1/}
    token: ${MARKETDATA_TOKEN:}
    cache-ttl: ${MARKETDATA_CACHE_TTL:PT15M}
    chain-dte: ${MARKETDATA_CHAIN_DTE:45}
    chain-strike-limit: ${MARKETDATA_CHAIN_STRIKE_LIMIT:30}

logging:
  level:
    org.springframework.security: INFO